[pytest]
# Settings únicos: o modo é escolhido por DJANGO_DEBUG, não por módulo. O CI
# define DJANGO_DEBUG=1 no job de testes para desligar SECURE_SSL_REDIRECT,
# que transformaria todo request do test client em 301.
DJANGO_SETTINGS_MODULE = config.settings

# O padrão do pytest é test_*.py, que não encontra nada aqui: a convenção do
# projeto é tests.py por app. Sem esta linha a suíte é coletada vazia.
python_files = tests.py tests_*.py test_*.py

# Restringe a busca aos apps: deploy/ e scripts/ têm .py que não são teste.
testpaths = core editor fonts jobs legal

addopts = --strict-markers

# --strict-markers exige registro: sem isto, um @pytest.mark.e2e digitado
# errado passaria batido em vez de falhar a coleta.
markers =
    e2e: testes de ponta a ponta num navegador de verdade (job separado no CI).
