{% extends "base.html" %}

{% block title %}Fonte | StölbenVetorial{% endblock %}

{% block content %}
<section class="split-grid">
    <div class="form-shell">
        <div class="eyebrow">Fonte</div>
        <h1 class="section-title" style="margin-top: 0.7rem;">{% if form.instance.pk %}Editar fonte{% else %}Cadastrar fonte{% endif %}</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-grid">
                {% for field in form %}
                    <div class="field-group">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {{ field.errors }}
                    </div>
                {% endfor %}
            </div>
            <div class="inline-actions">
                <button type="submit">Salvar fonte</button>
                <a class="button button-secondary" href="{% url 'fonts:list' %}">Voltar</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
