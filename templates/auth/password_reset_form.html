{% extends "base.html" %}

{% block title %}Redefinir Senha | Vetorial{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="form-shell">
        <div class="eyebrow">Senha</div>
        <h1 class="section-title" style="font-size: 2rem; margin-top: 0.7rem;">Redefinir senha</h1>
        <p class="muted">Informe o e-mail da conta. Em ambiente local, o link será exibido no console do servidor.</p>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Enviar instruções</button>
        </form>
    </div>
</section>
{% endblock %}
