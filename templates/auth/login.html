{% extends "base.html" %}

{% block title %}Entrar | Vetorial{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="form-shell">
        <div class="eyebrow">Acesso</div>
        <h1 class="section-title" style="font-size: 2rem; margin-top: 0.7rem;">Entrar</h1>
        <p class="muted">Entre com seu usuário e senha para acessar o sistema.</p>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Entrar</button>
        </form>
    </div>
</section>
{% endblock %}
