{% extends "base.html" %}

{% block title %}Nova Senha | Vetorial{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="form-shell">
        <div class="eyebrow">Senha</div>
        <h1 class="section-title" style="font-size: 2rem; margin-top: 0.7rem;">Definir nova senha</h1>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Salvar nova senha</button>
        </form>
    </div>
</section>
{% endblock %}
