{% extends "base.html" %}

{% block title %}Excluir lote | Vetorial{% endblock %}

{% block content %}
<section class="split-grid">
    <div class="form-shell">
        <div class="eyebrow">Excluir lote</div>
        <h1 class="section-title" style="margin-top: 0.7rem;">Remover {{ object.name }}?</h1>
        <p class="muted">Esta ação remove o lote, os itens processados e os downloads associados a ele.</p>
        <form method="post">
            {% csrf_token %}
            <div class="inline-actions">
                <button type="submit">Confirmar exclusão</button>
                <a class="button button-secondary" href="{% url 'jobs:detail' object.pk %}">Cancelar</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
