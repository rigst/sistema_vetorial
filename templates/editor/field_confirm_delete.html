{% extends "base.html" %}

{% block title %}Excluir Campo | Vetorial{% endblock %}

{% block content %}
<section class="split-grid">
    <div class="form-shell">
        <div class="eyebrow">Excluir campo</div>
        <h1 class="section-title" style="margin-top: 0.7rem;">Remover {{ object.label }}?</h1>
        <p class="muted">O campo deixará de ser usado na prévia e na geração final deste template.</p>
        <form method="post">
            {% csrf_token %}
            <div class="inline-actions">
                <button type="submit">Confirmar exclusão</button>
                <a class="button button-secondary" href="{% url 'editor:detail' template_obj.pk %}">Cancelar</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
