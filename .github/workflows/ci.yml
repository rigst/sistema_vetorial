name: CI

# O pipeline vive em github.com/rigst/ci. Ajuste lá vale para todos os projetos.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # Fixado no SHA, e não na tag v1: tag é ponteiro móvel, e quem puder
    # reescrevê-la passa a rodar código arbitrário com os secrets deste repo.
    # O comentário ao lado é o que o Dependabot lê para propor a subida.
    uses: rigst/ci/.github/workflows/python-django.yml@934b4f046dcedc840ec32b9886d5bf5d99e58812 # v1
    # Explícito em vez de `secrets: inherit`: o workflow chamado recebe só
    # este, e não tudo que o repositório tiver hoje ou vier a ter.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      python-version: "3.12"
      django-settings-module: config.settings
      source-paths: "config core editor fonts jobs legal"

      # O banco cai em SQLite quando DB_ENGINE não é definido, então o job de
      # testes não precisa de Postgres.
      postgres: false

      # A suíte chama pdftoppm por subprocess para rasterizar PDF; sem o
      # binário os testes falham com FileNotFoundError.
      apt-packages: "poppler-utils"

      # Sem DJANGO_DEBUG, os settings entram em modo produção — que é o que o
      # check --deploy precisa auditar. Valores fictícios.
      django-env: |
        DJANGO_SECRET_KEY=ci-only-5d4c3b2a19087766-NaoEhUmaChaveReal-gfedcbazyx
        DJANGO_ALLOWED_HOSTS=example.com

      # DJANGO_DEBUG=1 desliga SECURE_SSL_REDIRECT, HSTS e cookies seguros, que
      # em produção derrubariam todo request do test client em 301.
      # STATIC_ROOT e MEDIA_ROOT apontam por padrão para
      # /var/www/sistema_vetorial/shared, que no runner não existe e não é
      # gravável — os testes que escrevem arquivo morriam com PermissionError.
      test-env: |
        DJANGO_DEBUG=1
        DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver
        CELERY_TASK_ALWAYS_EAGER=1
        DJANGO_STATIC_ROOT=/tmp/vetorial-static
        DJANGO_MEDIA_ROOT=/tmp/vetorial-media

      # Nada em soft-fail: toda etapa bloqueia, inclusive as seis novas.
      # ruff e mypy já foram zerados, sem nenhum `# type: ignore` — portão
      # que fecha sobre exceção declarada não protege do caso seguinte.
      soft-fail: ""

      # --- conformidade ---
      run-licencas: true
      run-sbom: true

      # Confere o requirements.lock contra o requirements.txt (pin exato,
      # vindo do `pip freeze` do servidor) e instala com --require-hashes.
      # Resolvido para 3.12, a versão que produção roda.
      run-lock: true

      # --- ponta a ponta ---
      run-e2e: true

      # --- acessibilidade ---
      # Cinco telas públicas — as mesmas do divisor_pdf/sistema_questoes,
      # já que vêm do mesmo app `legal` compartilhado. /termos/ e
      # /privacidade/ só entram porque o setup abaixo publica os documentos:
      # sem eles a view levanta Http404 de propósito.
      run-a11y: true
      a11y-setup-command: python manage.py importar_documentos_legais --publicar
      a11y-paths: |
        /login/
        /termos/
        /privacidade/
        /legal/aceite/
        /admin/login/
      # Medido antes de ligar: sete violações (contraste do --muted, do
      # rodapé/summary que herda dele, e links de texto corrido distinguidos
      # só pela cor). Corrigidas: --muted escurecido um degrau (4,14:1 ->
      # 5,47:1) e sublinhado nos links de `.legal-corpo`/`.legal-atalhos`/
      # etc. Zero violações hoje em WCAG 2.1 AA, então o limite fica no
      # padrão `serious`.
      a11y-fail-on: serious

      # Desligado nas PRs do Dependabot: o GitHub não entrega os secrets do
      # Actions a esse ator, e sem o SONAR_TOKEN o scanner falha com
      # "Not authorized" — travando toda atualização de dependência, já que
      # o job `CI` é obrigatório no branch protection.
      run-sonar: ${{ github.actor != 'dependabot[bot]' }}
      sonar-project-key: rigst_sistema_vetorial
      sonar-organization: rigst
      # `qualitygate.wait`: sem isto o job termina verde assim que envia a
      # análise, e o gate reprovando não aparece no CI.
      #
      # `sonar.coverage.exclusions` acrescenta `**/settings.py` à lista do
      # pipeline compartilhado, que só traz `**/settings/**` — a forma de
      # pacote. Este projeto tem settings em arquivo único, então o glob não
      # casava, e o bloco do Sentry (que por construção não roda em teste)
      # entrava na conta de cobertura.
      #
      # Os quatro últimos itens alinham a lista com o que o .coveragerc já
      # omite: celery.py, scripts/, deploy/ e e2e/. Sem esse alinhamento o
      # coverage.xml não traz dado nenhum sobre eles e o Sonar os conta como
      # 0% — são 466 linhas, todas recentes (vieram com as etapas de licenças,
      # e2e e o trabalho do nginx), e sozinhas puxavam o "código novo" de ~80%
      # para 49%. Arquivo fora da medição não pode contar como descoberto.
      # questoes e financas já traziam scripts/ e deploy/ por esse motivo.
      #
      # A lista vem repetida por inteiro de propósito: propriedade repetida no
      # scanner é substituída, não somada — passar só o item novo apagaria as
      # exclusões de migrations, testes e conftest.
      sonar-args: >-
        -Dsonar.qualitygate.wait=true
        -Dsonar.coverage.exclusions=**/migrations/**,**/tests.py,**/tests_*.py,**/test_*.py,**/tests/**,**/conftest.py,**/settings/**,**/settings.py,**/manage.py,**/wsgi.py,**/asgi.py,**/celery.py,scripts/**,deploy/**,e2e/**
